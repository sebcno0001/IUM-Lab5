services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: ium-lab5:train
    command: ["python", "src/pipeline.py"]
    env_file:
      - .env.train
    mem_limit: 512m
    cpus: 1.0
    expose:
      - "5000"
    # Dane, model i wyniki pozostają na hoście po usunięciu kontenera.
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results

  visualize:
    build:
      context: ./visualize
      dockerfile: Dockerfile
    image: ium-lab5:visualize
    depends_on:
      - train
    ports:
      - "8080:8080"
    volumes:
      - ./results:/results:ro
