services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: ium-lab5:train
    command: ["python", "src/pipeline.py"]
    env_file:
      - .env.train
    # Dane, model i wyniki pozostają na hoście po usunięciu kontenera.
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
